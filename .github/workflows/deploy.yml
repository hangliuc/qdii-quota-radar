name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_DIR=/root/alipay-nasdaq-fund-monitor

            # 首次部署：clone
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/hangliuc/alipay-nasdaq-fund-monitor.git $APP_DIR
            fi

            cd $APP_DIR
            git fetch origin main
            git reset --hard origin/main

            # 写入 .env（从 GitHub Secrets 注入，不进 git）
            cat > .env << 'ENVEOF'
            FEISHU_WEBHOOK=${{ secrets.FEISHU_WEBHOOK }}
            IMAGE_BASE_URL=http://${{ secrets.SERVER_HOST }}:8900
            ENVEOF
            # 去掉行首空格
            sed -i 's/^            //' .env

            # 重建并启动
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "✅ 部署完成"
