name: Alipay NASDAQ QDII Fund Monitor

on:
  schedule:
    # 每天北京时间 9:00 运行 (UTC+8 → UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Scrape data & generate image (no notify yet)
        run: python main.py --no-notify

      - name: Commit & push data + image
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ output/ || true
          git diff --staged --quiet || git commit -m "chore: update $(date +%Y-%m-%d)"
          git push || true

      - name: Send Feishu notification (image is now on GitHub)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "
          import os
          from datetime import datetime
          from notifier import send_notification, build_reminder_elements
          webhook = os.environ.get('FEISHU_WEBHOOK', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          date_str = datetime.now().strftime('%Y%m%d')
          image_url = f'https://raw.githubusercontent.com/{repo}/main/output/fund_card_{date_str}.png' if repo else ''
          title, elements = build_reminder_elements(image_url)
          send_notification(webhook, title, elements)
          "
