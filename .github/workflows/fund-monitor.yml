name: Alipay NASDAQ QDII Fund Monitor

on:
  schedule:
    # 每天北京时间 12:00 (UTC 4:00)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Scrape & generate images
        run: python main.py --no-notify

      - name: Commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ output/ || true
          git diff --staged --quiet || git commit -m "chore: update $(date +%Y-%m-%d)"
          git push || true

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "
          import os
          from datetime import datetime
          from fund_monitor.notifier import FeishuNotifier
          webhook = os.environ.get('FEISHU_WEBHOOK', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          d = datetime.now().strftime('%Y%m%d')
          base = f'https://raw.githubusercontent.com/{repo}/main/output'
          urls = [f'{base}/passive_{d}.png', f'{base}/active_{d}.png'] if repo else []
          FeishuNotifier(webhook).send_reminder(urls)
          "
