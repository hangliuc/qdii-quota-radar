name: Alipay NASDAQ QDII Fund Monitor

on:
  schedule:
    # 先设为5分钟后测试（UTC时间），测试成功后改为 8:40 北京时间
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Scrape & generate images
        run: python main.py --no-notify

      - name: Commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "chore: update $(date +%Y-%m-%d)"
          git push

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python -c "
          import os
          from datetime import datetime
          from fund_monitor.notifier import FeishuNotifier
          webhook = os.environ.get('FEISHU_WEBHOOK', '')
          d = datetime.now().strftime('%Y%m%d')
          base = 'https://hangliuc.github.io/alipay-nasdaq-fund-monitor'
          urls = [f'{base}/passive_{d}.png', f'{base}/active_{d}.png']
          FeishuNotifier(webhook).send_reminder(urls)
          "
